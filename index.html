<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamDuck</title>
  <meta name="description" content="StreamDuck — browse movies, TV shows and anime.">
  <meta name="theme-color" content="#08080b">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

       old stylesheet can never be paired with new markup. -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="mode-dynamic theme-home">

<a class="skip-link" href="#app">Skip to content</a>

<nav>
  <button class="logo" id="duckLogo" aria-label="StreamDuck — home" onclick="Router.go('home')">
    <img src="icon.webp" alt="" width="34" height="34" class="logo-icon">
    <span translate="no">Stream<span class="logo-mark">Duck</span></span>
  </button>

  <div class="nav-links" id="navLinks">
    <button class="nav-btn active" data-sec="home" onclick="Router.go('home')">Home</button>
    <button class="nav-btn" data-sec="movies" onclick="Router.go('movies')">Movies</button>
    <button class="nav-btn" data-sec="tv" onclick="Router.go('tv')">TV Shows</button>
    <button class="nav-btn" data-sec="trending" onclick="Router.go('trending')">Trending</button>
    <button class="nav-btn" data-sec="anime" onclick="Router.go('anime')">Anime</button>
  </div>

  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
    <label class="visually-hidden" for="searchInput">Search movies or shows</label>
    <input type="search" id="searchInput" name="q" placeholder="Search movies or shows…" autocomplete="off" spellcheck="false">
    <div class="live-search-results" id="liveSearchResults" role="listbox" aria-live="polite" aria-label="Search results"></div>
  </div>

  <div class="nav-actions">
    <button class="icon-btn mobile-menu-btn" aria-label="Search" onclick="UI.toggleSearch()">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    </button>
    <button class="icon-btn" aria-label="Settings" onclick="AppSettings.toggleDrawer()">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
    </button>
    <button class="icon-btn mobile-menu-btn" aria-label="Menu" onclick="UI.toggleMobileMenu()">
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>
  </div>
</nav>

<main id="app"></main>

<nav class="mobile-bottom-nav" aria-label="Primary">
  <button class="mobile-nav-btn active" data-route="home" onclick="Router.go('home')">
    <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span>
  </button>
  <button class="mobile-nav-btn" data-route="movies" onclick="Router.go('movies')">
    <svg class="icon" aria-hidden="true"><use href="#i-film"/></svg><span>Movies</span>
  </button>
  <button class="mobile-nav-btn" data-route="tv" onclick="Router.go('tv')">
    <svg class="icon" aria-hidden="true"><use href="#i-tv"/></svg><span>TV</span>
  </button>
  <button class="mobile-nav-btn" data-route="settings" onclick="AppSettings.toggleDrawer()">
    <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span>
  </button>
</nav>

<!-- Settings drawer -->
<div id="settingsOverlay" class="settings-overlay" onclick="AppSettings.closeDrawerOnOverlay(event)">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-label="App settings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="close-btn" aria-label="Close settings" onclick="AppSettings.toggleDrawer()">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="settings-group">
      <span class="settings-label">Colour engine</span>
      <div class="settings-card">
        <button class="toggle-row" onclick="AppSettings.handleToggleClick('dynamic')">
          <span class="toggle-info">
            <span class="toggle-title"><svg class="icon" aria-hidden="true"><use href="#i-palette"/></svg>Dynamic accents</span>
            <span class="toggle-desc">Shift the palette to match each section</span>
          </span>
          <span class="switch"><input type="checkbox" id="chk-dynamic" tabindex="-1" aria-hidden="true"><span class="slider"></span></span>
        </button>
      </div>
    </div>

    <div class="settings-group">
      <span class="settings-label">Viewing comfort</span>
      <div class="settings-card">
        <button class="toggle-row" onclick="AppSettings.handleToggleClick('spoiler')">
          <span class="toggle-info">
            <span class="toggle-title"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>Spoiler safe</span>
            <span class="toggle-desc">Hide synopses until you ask for them</span>
          </span>
          <span class="switch"><input type="checkbox" id="chk-spoiler-safe" tabindex="-1" aria-hidden="true"><span class="slider"></span></span>
        </button>
      </div>
    </div>

    <div class="settings-group">
      <span class="settings-label">Fixed themes</span>
      <div class="settings-card">
        <button class="toggle-row" onclick="AppSettings.handleToggleClick('dark')">
          <span class="toggle-info">
            <span class="toggle-title"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>Midnight</span>
            <span class="toggle-desc">One steady dark palette everywhere</span>
          </span>
          <span class="switch"><input type="checkbox" id="chk-dark" tabindex="-1" aria-hidden="true"><span class="slider"></span></span>
        </button>

        <button class="toggle-row" onclick="AppSettings.handleToggleClick('amoled')">
          <span class="toggle-info">
            <span class="toggle-title"><svg class="icon" aria-hidden="true"><use href="#i-contrast"/></svg>Pure black</span>
            <span class="toggle-desc">True blacks for OLED screens</span>
          </span>
          <span class="switch"><input type="checkbox" id="chk-amoled" tabindex="-1" aria-hidden="true"><span class="slider"></span></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Title detail overlay -->
<div id="dashboardOverlay" class="dashboard-overlay" role="dialog" aria-modal="true" aria-label="Title details">
  <button class="dash-back" onclick="UI.closeDashboard()">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Back
  </button>
  <div class="dash-hero">
    <div class="dash-hero-bg" id="dashHeroBg"></div>
    <div class="dash-hero-fade"></div>
    <div class="dash-header-content">
      <img class="dash-poster" id="dashPoster" src="" alt="" width="172" height="258">
      <div class="dash-details">
        <h1 id="dashTitle">Loading…</h1>
        <div class="dash-meta" id="dashMeta"></div>
        <div class="hero-actions" style="margin-top:1.1rem" id="dashPrimaryActions"></div>
      </div>
    </div>
  </div>

  <div class="dash-body">
    <div>
      <h2>Synopsis</h2>
      <p class="dash-overview" id="dashOverview"></p>

      <h2>Cast</h2>
      <div class="scroll-row" id="dashCastRow" style="margin-bottom:2.5rem"></div>

      <h2>More like this</h2>
      <div class="scroll-row" id="dashRecommendationsRow"></div>
    </div>

    <div id="tvSelectorSection" class="hidden-section">
      <div class="tv-controls">
        <h3>Episodes</h3>
        <label class="visually-hidden" for="seasonDropdown">Select season</label>
        <select id="seasonDropdown" class="select-style" onchange="App.handleSeasonChange(this.value)"></select>
        <div class="episode-list" id="episodeGrid"></div>
      </div>
    </div>
  </div>
</div>

<template id="home-tpl">
  <div id="hero" class="fade-in">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-fade"></div>
    <div class="hero-content">
      <p class="hero-badge">Featured</p>
      <h1 class="hero-title" id="heroTitle">Loading…</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-overview" id="heroOverview"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="heroPlayBtn"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>Play</button>
        <button class="btn btn-secondary" id="heroInfoBtn"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>More info</button>
      </div>
    </div>
  </div>

  <section id="continue-section" class="section fade-in hidden-section">
    <div class="section-header">
      <h2 class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Continue watching</h2>
      <button class="see-all" onclick="ContinueWatching.clearAll()">Clear all</button>
    </div>
    <div class="scroll-row" id="continue-row"></div>
  </section>

  <section id="watchlist-section" class="section fade-in hidden-section">
    <div class="section-header">
      <h2 class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>My watchlist</h2>
      <button class="see-all" onclick="Watchlist.render()">Refresh<svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="scroll-row" id="watchlist-row"></div>
  </section>

  <section class="section fade-in">
    <div class="section-header">
      <h2 class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg>Trending now</h2>
      <button class="see-all" onclick="Router.go('trending')">See all<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </div>
    <div class="scroll-row" id="trendingRow"></div>
  </section>

  <div class="shuffler-break fade-in">
    <div class="shuffler-text">
      <h2 class="shuffler-title">Stuck on what to watch?</h2>
      <p class="shuffler-desc">Let the duck pick something from what&rsquo;s trending today.</p>
      <button class="btn btn-primary" id="shuffleInitBtn" onclick="App.shuffle()"><svg class="icon" aria-hidden="true"><use href="#i-dice"/></svg>Spin the wheel</button>
    </div>
    <div class="shuffler-display">
      <div class="shuffler-card-wrap">
        <div class="shuffler-card" id="shuffleCard"><img src="icon.png" alt="" id="shuffleImg"></div>
      </div>
      <div class="shuffler-info" id="shuffleInfo">
        <div class="shuffler-name" id="shuffleName">&mdash;</div>
        <div class="shuffler-btns">
          <button class="btn btn-primary" id="shufflePlayBtn"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>Details</button>
          <button class="btn btn-secondary" aria-label="Spin again" onclick="App.shuffle()" style="padding:11px;width:42px">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <section class="section fade-in">
    <div class="section-header">
      <h2 class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-film"/></svg>Popular movies</h2>
      <button class="see-all" onclick="Router.go('movies')">See all<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </div>
    <div class="scroll-row" id="topRatedRow"></div>
  </section>

  <section class="section fade-in">
    <div class="section-header">
      <h2 class="section-title"><svg class="icon" aria-hidden="true"><use href="#i-tv"/></svg>Popular TV shows</h2>
      <button class="see-all" onclick="Router.go('tv')">See all<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </div>
    <div class="scroll-row" id="tvRow"></div>
  </section>
</template>

<template id="grid-tpl">
  <section class="section fade-in">
    <div class="grid-header-wrap">
      <h1 id="gridTitle"></h1>
      <div class="filter-controls" id="filterControls">
        <label class="visually-hidden" for="genreFilter">Filter by genre</label>
        <select id="genreFilter" class="select-style" onchange="App.handleFilterChange()">
          <option value="">All genres</option>
        </select>
        <label class="visually-hidden" for="sortBy">Sort by</label>
        <select id="sortBy" class="select-style" onchange="App.handleFilterChange()">
          <option value="popularity.desc">Popularity</option>
          <option value="vote_average.desc">Rating, high to low</option>
          <option value="release_date.desc">Newest first</option>
        </select>
      </div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
  </section>
</template>

<!-- Player -->
<div id="playerModal" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="modal-content">
    <div class="player-header">
      <div style="min-width:0">
        <h2 class="p-title" id="pTitle"></h2>
        <div class="source-toggle">
          <button class="src-btn active" onclick="UI.switchSource('pulp', this)">Source 1</button>
          <button class="src-btn" onclick="UI.switchSource('vidapi', this)">Source 2</button>
          <span id="playerEpisodeIndicator"></span>
        </div>
      </div>
      <div class="player-actions">
        <button class="btn btn-secondary" id="playerNextEpBtn" style="display:none">
          <svg class="icon" aria-hidden="true"><use href="#i-skip"/></svg>Next episode
        </button>
        <button class="close-btn" aria-label="Close player" onclick="UI.closePlayer()">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </div>
    <div class="iframe-container">
      <iframe id="playerIframe" title="Video player" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>
</div>

<footer>
  <span class="footer-mark" translate="no">StreamDuck</span>
  <span>&copy; 2026</span>
</footer>

<script>
  const TMDB_API_KEY = "a31a9bbd61ad9d66f465457558a2d397";
  const TMDB_BASE_URL = "https://api.themoviedb.org/3";
  const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
  const TMDB_BACKDROP_BASE = "https://image.tmdb.org/t/p/original";

  const PLACEHOLDER_POSTER = 'icon.png';
  const icon = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const dot = '<span class="dot" aria-hidden="true"></span>';

  const AppSettings = {
    themeMode: localStorage.getItem('duck_theme_mode') || 'dynamic',
    spoilerSafe: localStorage.getItem('duck_spoiler_safe') !== 'false',

    init() {
      if (this.themeMode === 'light') {
        this.themeMode = 'dynamic';
        localStorage.setItem('duck_theme_mode', 'dynamic');
      }
      this.applyThemeStyles();
      this.applySpoilerSetting();
    },
    toggleDrawer() {
      document.getElementById('settingsOverlay').classList.toggle('open');
    },
    closeDrawerOnOverlay(e) {
      if (e.target.id === 'settingsOverlay') this.toggleDrawer();
    },
    handleToggleClick(mode) {
      if (mode === 'spoiler') {
        this.setSpoilerSafe(!this.spoilerSafe);
        return;
      }
      this.themeMode = mode;
      localStorage.setItem('duck_theme_mode', mode);
      this.applyThemeStyles();
    },
    toggleSpoilerMode() {
      this.setSpoilerSafe(!this.spoilerSafe);
    },
    setSpoilerSafe(enabled) {
      this.spoilerSafe = enabled;
      localStorage.setItem('duck_spoiler_safe', enabled ? 'true' : 'false');
      this.applySpoilerSetting();
    },
    applySpoilerSetting() {
      document.body.classList.toggle('spoiler-safe-on', this.spoilerSafe);
      const input = document.getElementById('chk-spoiler-safe');
      if (input) input.checked = this.spoilerSafe;

      if (App.currentHeroItem) {
        const heroTitle = document.getElementById('heroTitle');
        const heroOverview = document.getElementById('heroOverview');
        const heroMeta = document.getElementById('heroMeta');
        if (heroTitle || heroOverview || heroMeta) {
          App.renderHero(App.currentHeroItem);
        }
      }

      const dashOverlay = document.getElementById('dashboardOverlay');
      if (App.currentMedia && dashOverlay && dashOverlay.classList.contains('open')) {
        UI.renderSynopsis(App.currentOverviewText || '');
      }
    },
    applyThemeStyles() {
      document.body.classList.remove('mode-dynamic', 'mode-dark', 'mode-amoled', 'mode-light');
      document.body.classList.add(`mode-${this.themeMode}`);

      ['dynamic', 'dark', 'amoled'].forEach(m => {
        const input = document.getElementById(`chk-${m}`);
        if (input) input.checked = (this.themeMode === m);
      });
    }
  };

  // Easter egg soundbite
  const EasterEgg = {
    clickCount: 0,
    lastClickTime: 0,
    audioUrl: 'easteregg.mp3',
    audioInstance: null,

    init() {
      const logo = document.getElementById('duckLogo');
      if (!logo) return;

      logo.addEventListener('click', () => {
        const currentTime = Date.now();
        if (currentTime - this.lastClickTime > 1500) {
          this.clickCount = 0;
        }

        this.clickCount++;
        this.lastClickTime = currentTime;

        if (this.clickCount === 7) {
          this.playSecretSound();
          this.clickCount = 0;
        }
      });
    },

    playSecretSound() {
      if (this.audioInstance) {
        this.audioInstance.pause();
        this.audioInstance.currentTime = 0;
      }
      this.audioInstance = new Audio(this.audioUrl);
      this.audioInstance.volume = 1.0;
      this.audioInstance.play().catch(err => console.log("Playback blocked: ", err));
    }
  };

  const Watchlist = {
    items: JSON.parse(localStorage.getItem('duck_watchlist')) || [],
    toggle(item) {
      const index = this.items.findIndex(i => i.id === item.id);
      if (index > -1) this.items.splice(index, 1);
      else this.items.push(item);
      localStorage.setItem('duck_watchlist', JSON.stringify(this.items));
      this.render();
      UI.updateDashboardWatchlistBtn(item.id);
    },
    has(id) { return this.items.some(i => i.id === id); },
    render() {
      const row = document.getElementById('watchlist-row');
      const sec = document.getElementById('watchlist-section');
      if (!row || !sec) return;
      if (this.items.length === 0) { sec.classList.add('hidden-section'); return; }
      sec.classList.remove('hidden-section');
      row.innerHTML = this.items.map(item => UI.createCardMarkup(item)).join('');
    }
  };

  const ContinueWatching = {
    items: JSON.parse(localStorage.getItem('duck_continue')) || [],
    save(item, progress = 40) {
      const index = this.items.findIndex(i => i.id === item.id);
      if (index > -1) this.items.splice(index, 1);
      this.items.unshift({ ...item, progress });
      localStorage.setItem('duck_continue', JSON.stringify(this.items));
      this.render();
    },
    clearAll() { this.items = []; localStorage.removeItem('duck_continue'); this.render(); },
    render() {
      const row = document.getElementById('continue-row');
      const sec = document.getElementById('continue-section');
      if (!row || !sec) return;
      if (this.items.length === 0) { sec.classList.add('hidden-section'); return; }
      sec.classList.remove('hidden-section');
      row.innerHTML = this.items.map(item => UI.createCardMarkup(item, true)).join('');
    }
  };

  const Router = {
    current: 'home',
    go(route) {
      this.current = route;

      const activeRoute = document.body.className.split(' ').find(c => c.startsWith('theme-'));
      if (activeRoute) document.body.classList.remove(activeRoute);
      document.body.classList.add(`theme-${route}`);

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-sec') === route));
      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-route') === route);
      });
      document.getElementById('navLinks').classList.remove('mobile-open');

      const app = document.getElementById('app');
      const template = document.getElementById((route === 'home') ? 'home-tpl' : 'grid-tpl');
      if (template) { app.innerHTML = template.innerHTML; App.initSection(route); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  const App = {
    shufflePool: [],
    currentMedia: null,
    currentHeroItem: null,
    currentOverviewText: '',
    currentSource: 'pulp',
    activeSeason: 1,
    activeEpisode: 1,
    totalEpisodesInActiveSeason: 1,
    totalSeasons: 1,

    async tmdbFetch(endpoint, queryParams = "") {
      try {
        const response = await fetch(`${TMDB_BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}&language=en-US${queryParams}`);
        return await response.json();
      } catch (err) { console.error(err); }
    },

    async init() {
      AppSettings.init();
      EasterEgg.init();
      Router.go('home');

      const inputEl = document.getElementById('searchInput');
      inputEl.addEventListener('input', (e) => this.handleLiveSearch(e.target.value));

      document.addEventListener('click', (e) => {
        if (!document.getElementById('searchWrap').contains(e.target)) {
          document.getElementById('liveSearchResults').classList.remove('active');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const player = document.getElementById('playerModal');
        const dash = document.getElementById('dashboardOverlay');
        const settings = document.getElementById('settingsOverlay');
        if (player.classList.contains('open')) UI.closePlayer();
        else if (settings.classList.contains('open')) AppSettings.toggleDrawer();
        else if (dash.classList.contains('open')) UI.closeDashboard();
      });
    },

    async initSection(section) {
      if (section === 'home') {
        Watchlist.render();
        ContinueWatching.render();
        const trendingData = await this.tmdbFetch('/trending/all/day');
        if (trendingData && trendingData.results.length > 0) {
          this.shufflePool = trendingData.results;
          this.renderHero(trendingData.results[0]);
          document.getElementById('trendingRow').innerHTML = trendingData.results.map(i => UI.createCardMarkup(i)).join('');
        }
        const movieData = await this.tmdbFetch('/movie/popular');
        if (movieData) document.getElementById('topRatedRow').innerHTML = movieData.results.map(i => ({ ...i, media_type: 'movie' })).map(i => UI.createCardMarkup(i)).join('');
        const tvData = await this.tmdbFetch('/tv/popular');
        if (tvData) document.getElementById('tvRow').innerHTML = tvData.results.map(i => ({ ...i, media_type: 'tv' })).map(i => UI.createCardMarkup(i)).join('');
      } else {
        const labels = { movies: 'Movies', tv: 'TV Shows', trending: 'Trending', anime: 'Anime' };
        document.getElementById('gridTitle').innerText = labels[section] || section;
        await this.populateGenres(section);
        this.populateGridRows(section);
      }
    },

    async populateGenres(type) {
      const genreSelect = document.getElementById('genreFilter');
      if (!genreSelect) return;
      genreSelect.innerHTML = '<option value="">All genres</option>';

      let endpoint = '/genre/movie/list';
      if (type === 'tv' || type === 'anime') {
        endpoint = '/genre/tv/list';
      } else if (type === 'trending') {
        endpoint = '/genre/movie/list';
      }

      const data = await this.tmdbFetch(endpoint);
      if (data && data.genres) {
        data.genres.forEach(g => {
          genreSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
        });
      }
    },

    handleFilterChange() {
      this.populateGridRows(Router.current);
    },

    renderHero(item) {
      this.currentHeroItem = item;
      const title = item.title || item.name;
      const bg = document.getElementById('heroBg');
      const titleEl = document.getElementById('heroTitle');
      const overviewEl = document.getElementById('heroOverview');
      const metaEl = document.getElementById('heroMeta');
      const playBtn = document.getElementById('heroPlayBtn');
      const infoBtn = document.getElementById('heroInfoBtn');

      if (bg) bg.style.backgroundImage = `url('${TMDB_BACKDROP_BASE}${item.backdrop_path}')`;
      if (titleEl) titleEl.innerText = title;
      if (overviewEl) {
        if (AppSettings.spoilerSafe) {
          overviewEl.innerHTML = '<span class="spoiler-safe-text">Spoiler-safe mode is on — synopsis hidden.</span>';
        } else {
          overviewEl.innerText = item.overview || "";
        }
      }
      if (metaEl) {
        const year = (item.release_date || item.first_air_date || '').split('-')[0];
        const kind = (item.media_type || (item.title ? 'movie' : 'tv')) === 'tv' ? 'TV' : 'Film';
        metaEl.innerHTML = `
          <span class="rating-chip">${icon('star')}${Number(item.vote_average || 0).toFixed(1)}</span>
          ${dot}<span class="tnum">${year || '—'}</span>
          ${dot}<span>${kind}</span>`;
      }

      const normalized = { ...item, media_type: item.media_type || (item.title ? 'movie' : 'tv') };
      if (playBtn) playBtn.onclick = () => UI.openDashboard(normalized, true);
      if (infoBtn) infoBtn.onclick = () => UI.openDashboard(normalized);
    },

    async populateGridRows(type) {
      const genreVal = document.getElementById('genreFilter')?.value || "";
      const sortVal = document.getElementById('sortBy')?.value || "popularity.desc";
      const grid = document.getElementById('movieGrid');
      if (!grid) return;

      let endpoint = "";
      let params = "";

      if (type === 'trending') {
        endpoint = '/trending/all/week';
        const data = await this.tmdbFetch(endpoint);
        if (data && data.results) {
          let results = data.results;
          if (genreVal) {
            results = results.filter(i => i.genre_ids && i.genre_ids.includes(parseInt(genreVal)));
          }
          if (sortVal === 'vote_average.desc') {
            results.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
          } else if (sortVal === 'release_date.desc') {
            results.sort((a, b) => {
              const dateA = new Date(a.release_date || a.first_air_date || 0);
              const dateB = new Date(b.release_date || b.first_air_date || 0);
              return dateB - dateA;
            });
          } else {
            results.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
          }
          grid.innerHTML = results.map(item => UI.createCardMarkup(item)).join('')
            || '<p style="color:var(--muted)">Nothing matches those filters.</p>';
        }
        return;
      }

      if (type === 'movies') {
        endpoint = '/discover/movie';
      } else if (type === 'tv') {
        endpoint = '/discover/tv';
      } else if (type === 'anime') {
        endpoint = '/discover/tv';
        params += '&with_genres=16&with_keywords=210024';
      }

      params += `&sort_by=${sortVal}`;
      if (sortVal === 'vote_average.desc') {
        params += '&vote_count.gte=100';
      }

      if (genreVal) {
        if (type === 'anime') {
          params += `,${genreVal}`;
        } else {
          params += `&with_genres=${genreVal}`;
        }
      }

      const data = await this.tmdbFetch(endpoint, params);
      if (data && data.results) {
        const mediaType = (type === 'movies') ? 'movie' : 'tv';
        grid.innerHTML = data.results.map(i => ({ ...i, media_type: i.media_type || mediaType })).map(item => UI.createCardMarkup(item)).join('')
          || '<p style="color:var(--muted)">Nothing matches those filters.</p>';
      }
    },

    shuffle() {
      const card = document.getElementById('shuffleCard');
      if (card) card.classList.add('spinning');
      setTimeout(() => {
        if (card) card.classList.remove('spinning');
        const randomItem = this.shufflePool[Math.floor(Math.random() * this.shufflePool.length)];
        if (!randomItem) return;
        document.getElementById('shuffleImg').src = randomItem.poster_path ? `${TMDB_IMAGE_BASE}${randomItem.poster_path}` : PLACEHOLDER_POSTER;
        document.getElementById('shuffleName').innerText = randomItem.title || randomItem.name;
        document.getElementById('shuffleInfo').classList.add('visible');
        const normalized = { ...randomItem, media_type: randomItem.media_type || (randomItem.title ? 'movie' : 'tv') };
        document.getElementById('shufflePlayBtn').onclick = () => UI.openDashboard(normalized);
      }, 800);
    },

    async handleLiveSearch(query) {
      const drawer = document.getElementById('liveSearchResults');
      if (!query.trim()) { drawer.classList.remove('active'); return; }

      const data = await this.tmdbFetch('/search/multi', `&query=${encodeURIComponent(query)}`);
      if (data && data.results) {
        const filtered = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv').slice(0, 6);
        if (filtered.length === 0) { drawer.classList.remove('active'); return; }

        drawer.innerHTML = filtered.map(item => {
          const name = item.title || item.name;
          const year = (item.release_date || item.first_air_date || '').split('-')[0] || '—';
          const poster = item.poster_path ? `${TMDB_IMAGE_BASE}${item.poster_path}` : PLACEHOLDER_POSTER;
          const normalizedStr = JSON.stringify({
            id: item.id, title: name, poster_path: item.poster_path,
            vote_average: item.vote_average, media_type: item.media_type,
            release_date: item.release_date || item.first_air_date, backdrop_path: item.backdrop_path
          }).replace(/"/g, '&quot;');

          return `
            <button type="button" class="live-search-item" role="option" onclick="document.getElementById('liveSearchResults').classList.remove('active'); UI.openDashboard(${normalizedStr})">
              <img src="${poster}" alt="" width="34" height="51" loading="lazy">
              <span class="live-search-details">
                <span class="live-search-name">${name}</span>
                <span class="live-search-meta tnum">${item.media_type === 'tv' ? 'TV' : 'Film'} &middot; ${year} &middot; ${Number(item.vote_average || 0).toFixed(1)}</span>
              </span>
            </button>`;
        }).join('');
        drawer.classList.add('active');
      }
    },

    async loadTVDetails(id) {
      const data = await this.tmdbFetch(`/tv/${id}`);
      if (!data) return;
      this.totalSeasons = data.number_of_seasons;
      const dropdown = document.getElementById('seasonDropdown');
      dropdown.innerHTML = Array.from({ length: data.number_of_seasons }, (_, i) => `<option value="${i + 1}">Season ${i + 1}</option>`).join('');

      if (this.activeSeason > data.number_of_seasons) {
        this.activeSeason = 1;
      }
      dropdown.value = this.activeSeason;
      this.handleSeasonChange(this.activeSeason);
    },

    async handleSeasonChange(seasonNum) {
      this.activeSeason = parseInt(seasonNum);
      const data = await this.tmdbFetch(`/tv/${this.currentMedia.id}/season/${seasonNum}`);
      if (!data || !data.episodes) return;
      this.totalEpisodesInActiveSeason = data.episodes.length;

      const grid = document.getElementById('episodeGrid');
      grid.innerHTML = data.episodes.map(ep => {
        const title = ep.name || `Episode ${ep.episode_number}`;
        const overview = ep.overview || "No synopsis available.";
        const airDate = ep.air_date ? ep.air_date.split('-')[0] : '—';
        const runtime = ep.runtime ? `${ep.runtime} min` : '';
        const thumb = ep.still_path ? `${TMDB_IMAGE_BASE}${ep.still_path}` : PLACEHOLDER_POSTER;

        return `
          <button type="button" class="episode-card ${this.activeEpisode === ep.episode_number ? 'active' : ''}" data-ep="${ep.episode_number}" onclick="App.playTVEpisode(${ep.episode_number})">
            <span class="episode-card-thumb-wrap">
              <img class="episode-card-thumb" src="${thumb}" alt="" loading="lazy">
              <span class="episode-card-play-overlay"><span class="episode-card-play-btn">${icon('play')}</span></span>
            </span>
            <span class="episode-card-info">
              <span class="episode-card-num-title">${ep.episode_number}. ${title}</span>
              <span class="episode-card-meta">${airDate}${runtime ? ` &middot; ${runtime}` : ''}</span>
              <span class="episode-card-overview">${overview}</span>
            </span>
          </button>`;
      }).join('');
    },

    playTVEpisode(epNum) {
      this.activeEpisode = parseInt(epNum);
      document.querySelectorAll('.episode-card').forEach(btn => btn.classList.toggle('active', parseInt(btn.getAttribute('data-ep')) === epNum));
      UI.openPlayer();
    },

    nextEpisode() {
      if (this.activeEpisode < this.totalEpisodesInActiveSeason) {
        this.playTVEpisode(this.activeEpisode + 1);
      } else if (this.activeSeason < this.totalSeasons) {
        this.activeEpisode = 1;
        document.getElementById('seasonDropdown').value = this.activeSeason + 1;
        this.handleSeasonChange(this.activeSeason + 1).then(() => {
          this.playTVEpisode(1);
        });
      }
    }
  };

  const UI = {
    toggleMobileMenu() { document.getElementById('navLinks').classList.toggle('mobile-open'); },
    toggleSearch() {
      const wrap = document.getElementById('searchWrap');
      wrap.classList.toggle('active');
      if (wrap.classList.contains('active')) document.getElementById('searchInput').focus();
    },

    createCardMarkup(item, includeProgress = false) {
      const title = item.title || item.name;
      const rating = item.vote_average ? Number(item.vote_average).toFixed(1) : '—';
      const normalized = {
        id: item.id,
        title: title,
        poster_path: item.poster_path,
        vote_average: rating,
        media_type: item.media_type || (item.title ? 'movie' : 'tv'),
        release_date: item.release_date || item.first_air_date || '',
        backdrop_path: item.backdrop_path,
        last_season: item.last_season || undefined,
        last_episode: item.last_episode || undefined
      };

      let progressText = `Resume &middot; ${item.progress || 40}%`;
      if (item.media_type === 'tv' && item.last_season && item.last_episode) {
        progressText = `Resume &middot; S${item.last_season}:E${item.last_episode}`;
      }

      const poster = item.poster_path ? TMDB_IMAGE_BASE + item.poster_path : PLACEHOLDER_POSTER;
      const year = (item.release_date || item.first_air_date || '').split('-')[0];
      const kind = normalized.media_type === 'tv' ? 'TV' : 'Film';

      return `
        <button type="button" class="card" onclick="UI.openDashboard(${JSON.stringify(normalized).replace(/"/g, '&quot;')})">
          <span class="card-poster-wrap">
            <img class="card-poster" src="${poster}" alt="" loading="lazy" width="170" height="255">
            <span class="card-rating tnum">${icon('star')}${rating}</span>
            ${includeProgress ? `<span class="card-progress-pill">${progressText}</span>` : ''}
            ${includeProgress ? `<span class="progress-bar" style="width:${item.progress || 40}%"></span>` : ''}
          </span>
          <span class="card-title">${title}</span>
          <span class="card-sub tnum">${kind}${year ? ` &middot; ${year}` : ''}</span>
        </button>`;
    },

    renderSynopsis(text) {
      const el = document.getElementById('dashOverview');
      if (!el) return;
      if (AppSettings.spoilerSafe) {
        el.innerHTML = `
          <span class="spoiler-safe-card">
            <span class="spoiler-safe-title">Spoiler-safe mode is on</span>
            <span class="spoiler-safe-subtitle">Reveal the synopsis if you want to read it.</span>
            <button type="button" class="btn btn-secondary spoiler-reveal-btn">Reveal synopsis</button>
          </span>`;
        const revealButton = el.querySelector('.spoiler-reveal-btn');
        if (revealButton) {
          revealButton.addEventListener('click', () => {
            AppSettings.setSpoilerSafe(false);
            UI.renderSynopsis(text || 'No synopsis available.');
          });
        }
      } else {
        el.innerText = text || 'No synopsis available.';
      }
    },

    async openDashboard(item, autoPlayDirectly = false) {
      App.currentMedia = item;
      App.activeSeason = item.last_season || 1;
      App.activeEpisode = item.last_episode || 1;

      document.getElementById('dashTitle').innerText = item.title;
      document.getElementById('dashPoster').src = item.poster_path ? TMDB_IMAGE_BASE + item.poster_path : PLACEHOLDER_POSTER;
      document.getElementById('dashHeroBg').style.backgroundImage = `url('${TMDB_BACKDROP_BASE}${item.backdrop_path || item.poster_path}')`;

      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      const details = await App.tmdbFetch(`/${type}/${item.id}`);

      document.getElementById('dashMeta').innerHTML = `
        <span class="rating-chip">${icon('star')}${Number(item.vote_average || 0).toFixed(1)}</span>
        ${dot}<span class="tnum">${item.release_date ? item.release_date.split('-')[0] : '—'}</span>
        ${dot}<span>${details?.runtime ? details.runtime + ' min' : (type === 'tv' ? 'TV series' : 'Film')}</span>`;

      App.currentOverviewText = details?.overview || 'No synopsis available.';
      this.renderSynopsis(App.currentOverviewText);

      document.getElementById('dashPrimaryActions').innerHTML = `
        <button class="btn btn-primary" onclick="${type === 'tv' ? 'App.playTVEpisode(App.activeEpisode)' : 'UI.openPlayer()'}">${icon('play')}Watch</button>
        <button class="btn btn-secondary" onclick="UI.openTrailerInNewTab()">${icon('clapper')}Trailer</button>
        <button class="btn btn-secondary" id="dashWatchlistBtn"></button>`;
      document.getElementById('dashWatchlistBtn').onclick = () => Watchlist.toggle(App.currentMedia);
      this.updateDashboardWatchlistBtn(item.id);

      if (type === 'tv') {
        document.getElementById('tvSelectorSection').classList.remove('hidden-section');
        await App.loadTVDetails(item.id);
      } else {
        document.getElementById('tvSelectorSection').classList.add('hidden-section');
      }

      const credits = await App.tmdbFetch(`/${type}/${item.id}/credits`);
      document.getElementById('dashCastRow').innerHTML = credits?.cast?.slice(0, 10).map(c => `
        <div class="cast-card">
          <img class="cast-img" src="${c.profile_path ? TMDB_IMAGE_BASE + c.profile_path : PLACEHOLDER_POSTER}" alt="" loading="lazy">
          <div class="cast-name">${c.name}</div>
          <div class="cast-char">${c.character || ''}</div>
        </div>`).join('') || '<p style="color:var(--muted)">No cast listed.</p>';

      const recommendations = await App.tmdbFetch(`/${type}/${item.id}/recommendations`);
      document.getElementById('dashRecommendationsRow').innerHTML = recommendations?.results?.slice(0, 8).map(r => UI.createCardMarkup({ ...r, media_type: type })).join('') || '<p style="color:var(--muted)">Nothing to suggest yet.</p>';

      document.getElementById('dashboardOverlay').classList.add('open');
      if (autoPlayDirectly) { if (type === 'tv') App.playTVEpisode(App.activeEpisode); else UI.openPlayer(); }
    },

    closeDashboard() { document.getElementById('dashboardOverlay').classList.remove('open'); },

    async openTrailerInNewTab() {
      const item = App.currentMedia;
      if (!item) return;
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      const videoData = await App.tmdbFetch(`/${type}/${item.id}/videos`);
      const trailer = videoData?.results?.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));

      if (trailer) {
        window.open(`https://www.youtube.com/watch?v=${trailer.key}`, '_blank', 'noopener');
      } else {
        alert("No trailer on record for this title.");
      }
    },

    openPlayer() {
      const item = App.currentMedia;
      if (!item) return;
      document.getElementById('pTitle').innerText = item.title;

      const isTV = item.media_type === 'tv';
      const nextBtn = document.getElementById('playerNextEpBtn');
      nextBtn.style.display = isTV ? 'inline-flex' : 'none';
      nextBtn.onclick = () => App.nextEpisode();

      this.loadIframeSource();
      document.getElementById('playerModal').classList.add('open');

      if (isTV) {
        item.last_season = App.activeSeason;
        item.last_episode = App.activeEpisode;
      }
      ContinueWatching.save(item, Math.floor(Math.random() * 50) + 30);
    },

    closePlayer() {
      document.getElementById('playerIframe').src = "";
      document.getElementById('playerModal').classList.remove('open');
    },

    switchSource(src, btn) {
      App.currentSource = src;
      document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      this.loadIframeSource();
    },

    loadIframeSource() {
      const iframe = document.getElementById('playerIframe');
      if (!iframe || !App.currentMedia) return;
      const item = App.currentMedia;
      const type = item.media_type === 'tv' ? 'tv' : 'movie';

      if (type === 'tv') {
        document.getElementById('playerEpisodeIndicator').innerText = `S${App.activeSeason}:E${App.activeEpisode}`;
        iframe.src = App.currentSource === 'pulp'
          ? `https://vidsrc.me/embed/tv?tmdb=${item.id}&season=${App.activeSeason}&episode=${App.activeEpisode}`
          : `https://vidsrc.to/embed/tv/${item.id}/${App.activeSeason}/${App.activeEpisode}`;
      } else {
        document.getElementById('playerEpisodeIndicator').innerText = "";
        iframe.src = App.currentSource === 'pulp'
          ? `https://vidsrc.me/embed/movie?tmdb=${item.id}`
          : `https://vidsrc.to/embed/movie/${item.id}`;
      }
    },

    updateDashboardWatchlistBtn(id) {
      const btn = document.getElementById('dashWatchlistBtn');
      if (!btn) return;
      const saved = Watchlist.has(id);
      btn.innerHTML = saved ? `${icon('bookmark-fill')}Saved` : `${icon('bookmark')}Watchlist`;
    }
  };

  window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
